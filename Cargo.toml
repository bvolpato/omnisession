[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.8.47"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Bruno Volpato"]
repository = "https://github.com/bvolpato/omnisession"
homepage = "https://bvolpato.github.io/omnisession/"
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0"
base64 = { version = "0.23", default-features = false, features = ["std"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
directories = "6.0"
fs2 = "0.4"
hex = "0.4"
md-5 = "0.11"
prost = "0.14"
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
same-file = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.20"
thiserror = "2.0"
unicode-normalization = "0.1"
unicode-width = "0.2"
uuid = { version = "1.17", features = ["v4", "v5", "serde"] }
walkdir = "2.5"
wait-timeout = "0.2"
winapi-util = "0.1.11"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
