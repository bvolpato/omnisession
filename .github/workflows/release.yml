name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: release
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful CI for tagged commit
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1200))
          while (( SECONDS < deadline )); do
            state=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&per_page=1" \
              --jq 'if (.workflow_runs | length) == 0 then "missing\t" else (.workflow_runs[0] | "\(.status)\t\(.conclusion // "")") end')
            IFS=$'\t' read -r status conclusion <<<"$state"
            if [[ "$status" == completed && "$conclusion" == success ]]; then
              exit 0
            fi
            if [[ "$status" == completed ]]; then
              printf 'error: CI concluded %s for %s\n' "$conclusion" "$GITHUB_SHA" >&2
              exit 1
            fi
            sleep 15
          done
          printf 'error: timed out waiting for CI on %s\n' "$GITHUB_SHA" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: 11.1.0
          install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Verify tag and package versions
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)
          website_version=$(node --print 'require("./website/package.json").version')
          test "$version" = "$website_version"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "v$version" = "$GITHUB_REF_NAME"
          fi
      - name: Verify compatibility manifest outputs
        run: node scripts/provider-compatibility.mjs check
      - name: Load release-tested provider versions
        run: node scripts/provider-compatibility.mjs github-env >> "$GITHUB_ENV"
      - name: Verify website lockfile
        run: pnpm --dir website install --frozen-lockfile --lockfile-only
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-features
      - name: Verify published packages
        run: cargo package --locked --workspace
      - name: Smoke-test installer
        run: sh scripts/test-install.sh
      - name: Install pinned public provider CLIs
        run: |
          npm install --global --prefix "$RUNNER_TEMP/provider-clis" \
            @anthropic-ai/claude-code@"$CLAUDE_CODE_VERSION" \
            @openai/codex@"$CODEX_VERSION" \
            opencode-ai@"$OPENCODE_VERSION" \
            @xai-official/grok@"$GROK_VERSION"
      - name: Install pinned Hermes release
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$HERMES_TAG" \
            https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-agent"
          test "$(git -C "$RUNNER_TEMP/hermes-agent" rev-parse HEAD)" = "$HERMES_COMMIT"
          uv venv "$RUNNER_TEMP/hermes-venv" --python 3.12
          uv pip install --python "$RUNNER_TEMP/hermes-venv/bin/python" \
            --editable "$RUNNER_TEMP/hermes-agent"
          hermes_version=$("$RUNNER_TEMP/hermes-venv/bin/python" -I -B -c \
            'from importlib.metadata import version; print(version("hermes-agent"))')
          test "$hermes_version" = "$HERMES_VERSION"
          echo "$RUNNER_TEMP/hermes-venv/bin" >> "$GITHUB_PATH"
      - name: Run isolated cross-provider conformance
        run: PATH="$RUNNER_TEMP/provider-clis/bin:$PATH" scripts/test-provider-conformance.sh

  build:
    name: ${{ matrix.artifact }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: linux-x86_64
            archive: omni-linux-x86_64.tar.gz
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            artifact: linux-aarch64
            archive: omni-linux-aarch64.tar.gz
            target: aarch64-unknown-linux-musl
          - runner: macos-15-intel
            artifact: darwin-x86_64
            archive: omni-darwin-x86_64.tar.gz
            target: x86_64-apple-darwin
          - runner: macos-15
            artifact: darwin-aarch64
            archive: omni-darwin-aarch64.tar.gz
            target: aarch64-apple-darwin
          - runner: windows-latest
            artifact: windows-x86_64
            archive: omni-windows-x86_64.zip
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install static Linux toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --locked --release --package omnisession-cli --target "${{ matrix.target }}"
      - name: Verify static Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/omni"
          if readelf -l "$binary" | grep -q 'Requesting program interpreter'; then
            printf 'error: Linux release has a dynamic program interpreter\n' >&2
            exit 1
          fi
          if readelf -d "$binary" | grep -q '(NEEDED)'; then
            printf 'error: Linux release depends on shared libraries\n' >&2
            exit 1
          fi
      - name: Package release archive
        if: runner.os != 'Windows'
        shell: bash
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          stage="dist/${ARCHIVE%.tar.gz}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/omni" "$stage/omni"
          cp LICENSE "$stage/LICENSE"
          tar -C "$stage" -czf "dist/$ARCHIVE" omni LICENSE
      - name: Smoke-test release archive
        if: runner.os != 'Windows'
        shell: bash
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          mkdir -p dist/smoke
          tar -C dist/smoke -xzf "dist/$ARCHIVE"
          version=$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)
          test "$(dist/smoke/omni --version)" = "omni $version"
      - name: Package and smoke-test Windows release archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          ./scripts/package-windows.ps1 `
            -BinaryPath "target/${{ matrix.target }}/release/omni.exe" `
            -LicensePath LICENSE `
            -OutputPath "dist/${{ matrix.archive }}" `
            -ExpectedVersion $version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.artifact }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          shopt -s nullglob
          archives=(omni-*.tar.gz omni-*.zip)
          test "${#archives[@]}" -eq 5
          shasum -a 256 "${archives[@]}" | sort -k2 > SHA256SUMS
      - name: Create draft GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/omni-*.tar.gz
            dist/omni-*.zip
            dist/SHA256SUMS

  publish_release:
    name: Publish release
    needs: release
    if: github.event_name == 'push' && github.ref_type == 'tag' && needs.release.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Verify draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq '.isDraft')" = true
          expected_assets=$(printf '%s\n' \
            SHA256SUMS \
            omni-darwin-aarch64.tar.gz \
            omni-darwin-x86_64.tar.gz \
            omni-linux-aarch64.tar.gz \
            omni-linux-x86_64.tar.gz \
            omni-windows-x86_64.zip)
          actual_assets=$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '[.assets[].name] | sort | .[]')
          test "$actual_assets" = "$(printf '%s\n' "$expected_assets" | sort)"
      - name: Publish draft release as latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest \
            --verify-tag

  public_install:
    name: Public installer (${{ matrix.arch }})
    needs: publish_release
    if: github.event_name == 'push' && github.ref_type == 'tag' && needs.publish_release.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install from public latest release
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)
          test "v$version" = "$GITHUB_REF_NAME"

          max_attempts=12
          sleep_seconds=10
          for attempt in $(seq 1 "$max_attempts"); do
            home_dir="$RUNNER_TEMP/omni-public-install-${{ matrix.arch }}-$attempt"
            install_dir="$RUNNER_TEMP/omni-public-bin-${{ matrix.arch }}-$attempt"
            log_path="$RUNNER_TEMP/omni-public-install-${{ matrix.arch }}-$attempt.log"
            mkdir -p "$home_dir" "$install_dir"

            if HOME="$home_dir" SHELL=/bin/bash OMNI_INSTALL_DIR="$install_dir" \
              OMNI_NO_MODIFY_PATH=1 sh install.sh >"$log_path" 2>&1; then
              if [ -x "$install_dir/omni" ] && \
                [ "$("$install_dir/omni" --version)" = "omni $version" ]; then
                printf 'Public latest installer returned omni %s on %s.\n' "$version" '${{ matrix.arch }}'
                exit 0
              fi
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              cat "$log_path"
              printf 'error: public latest installer did not return omni %s on %s\n' "$version" '${{ matrix.arch }}' >&2
              exit 1
            fi
            printf 'Public latest release has not propagated to %s yet; retrying (%s/%s) ...\n' \
              '${{ matrix.arch }}' "$attempt" "$max_attempts"
            sleep "$sleep_seconds"
          done

  public_install_windows:
    name: Public installer (windows/x86_64)
    needs: publish_release
    if: github.event_name == 'push' && github.ref_type == 'tag' && needs.publish_release.result == 'success'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install from public latest release
        shell: powershell
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag does not match package version"
          }

          $env:OMNI_NO_MODIFY_PATH = "1"
          $maximumAttempts = 12
          for ($attempt = 1; $attempt -le $maximumAttempts; $attempt += 1) {
            $env:OMNI_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "omni-public-bin-windows-x86_64-$attempt"
            $logPath = Join-Path $env:RUNNER_TEMP "omni-public-install-windows-x86_64-$attempt.log"
            $installed = $false
            try {
              & ./install.ps1 *> $logPath
              $binary = Join-Path $env:OMNI_INSTALL_DIR "omni.exe"
              if ([IO.File]::Exists($binary)) {
                $reported = (& $binary --version 2>$null | Out-String).Trim()
                $installed = $LASTEXITCODE -eq 0 -and $reported -eq "omni $version"
              }
            } catch {
              $_ | Out-String | Add-Content -LiteralPath $logPath
            }
            if ($installed) {
              Write-Output "Public latest installer returned omni $version on windows/x86_64."
              exit 0
            }
            if ($attempt -eq $maximumAttempts) {
              Get-Content -LiteralPath $logPath
              throw "Public latest installer did not return omni $version on windows/x86_64"
            }
            Write-Output "Public latest Windows release has not propagated; retrying ($attempt/$maximumAttempts)..."
            Start-Sleep -Seconds 10
          }
