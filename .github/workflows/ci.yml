name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  msrv:
    name: Rust 1.85.1 (MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@85c23e28f7ccc75a9a153d45d385d94a85464876 # 1.85.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check minimum supported Rust version
        run: cargo check --locked --workspace --all-targets --all-features

  test:
    name: Rust (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-features
      - name: Smoke-test CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo run --quiet --locked --package omnisession-cli -- --version
          cargo run --quiet --locked --package omnisession-cli -- --help >/dev/null
      - name: Verify published packages
        if: runner.os == 'Linux'
        run: cargo package --locked --workspace
      - name: Smoke-test installer
        if: runner.os == 'Linux'
        run: sh scripts/test-install.sh

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          toolchain: nightly-2026-08-01
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install coverage tooling
        uses: taiki-e/install-action@51c9d223e46ef0189fd65bfe00a28e0de249282c # cargo-llvm-cov
      - name: Measure line and branch coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/llvm-cov
          cargo llvm-cov \
            --locked \
            --workspace \
            --all-features \
            --branch \
            --json \
            --summary-only \
            --output-path target/llvm-cov/coverage-summary.json \
            --fail-under-lines 65 \
            --fail-under-functions 60 \
            --fail-under-regions 60
          jq --exit-status '.data[0].totals.branches.percent >= 40' \
            target/llvm-cov/coverage-summary.json
          cargo llvm-cov report \
            --branch \
            --html \
            --output-dir target/llvm-cov
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rust-coverage
          path: |
            target/llvm-cov/coverage-summary.json
            target/llvm-cov/html
          if-no-files-found: error
